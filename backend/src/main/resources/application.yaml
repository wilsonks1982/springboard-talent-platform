spring:
  application:
    name: springboard-talent-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${SERVER_PORT:8080}


app:
  storage:
    upload-dir: ${STORAGE_UPLOAD_DIR:${user.home}/springboard-uploads}
    max-file-size: ${STORAGE_MAX_FILE_SIZE:5242880} # 5MB
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type,Accept,Origin
    allow-credentials: true
    max-age: 3600
  jwt:
    secret: ${JWT_SECRET:VGhpc0lzQURldmVsb3BtZW50S2V5Rm9yU2JUb25seV9DaGFuZ2VNZQ==}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:15}
    issuer: ${JWT_ISSUER:springboard-talent}
  verification:
    expiry-minutes: ${VERIFICATION_EXPIRY_MINUTES:10}
    max-attempts: ${VERIFICATION_MAX_ATTEMPTS:5}


logging:
  level:
    root: WARN
    org.wilsonks: DEBUG
    org.springframework.security.web: DEBUG
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG